name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: version
        run: |
          # Conventional-commit driven semantic bumping. If there are
          # no commits since the last tag the workflow skips (avoids
          # publishing a no-op release for a force-push or admin
          # housekeeping). Defaults to v0.1.0 as the floor — the first
          # Web Store submission was v0.1.0, so any future release is
          # strictly higher.
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "Latest tag: $LATEST_TAG"

          COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s" 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_TAG — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.*\))?!:|BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\(.*\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP — $LATEST_TAG → v$NEW"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new_version }}" \
            --title "v${{ steps.version.outputs.new_version }}" \
            --generate-notes

  build:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:extension

      - name: Patch manifest version
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          # The source manifest.json carries a placeholder version
          # ("0.0.0" or the version of the last manually-submitted
          # release); CI overrides it on the build artifact so the
          # shipped zip matches the GitHub release tag.
          node -e "
            const fs = require('fs');
            const path = 'dist/extension/manifest.json';
            const m = JSON.parse(fs.readFileSync(path, 'utf8'));
            m.version = process.env.NEW_VERSION;
            fs.writeFileSync(path, JSON.stringify(m, null, 2) + '\n');
            console.log('Patched manifest version → ' + m.version);
          "

      - name: Zip extension
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          # Zip from inside dist/extension so manifest.json lives at
          # the zip root, not nested — Web Store rejects nested zips.
          cd dist/extension
          zip -r "../../relay-inspector-v${NEW_VERSION}.zip" .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          gh release upload "v${NEW_VERSION}" \
            "relay-inspector-v${NEW_VERSION}.zip"
