<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Relay Inspector — Demo</title>
    <style>
      body {
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
        background: #0a0a0a;
        color: #e4e4e7;
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      button {
        background: #18181b;
        color: #e4e4e7;
        border: 1px solid #27272a;
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #27272a;
      }
      pre {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 4px;
        padding: 12px;
        overflow: auto;
        font-size: 12px;
      }
      .muted {
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <h1>Relay Inspector — Demo Harness</h1>
    <p class="muted">
      Loads <code>/core.js</code>, fakes a Relay environment, and fires
      <code>store.publish</code> events. Open the inspector at
      <a href="/" style="color: #60a5fa">/</a> to watch records flow in.
    </p>

    <!-- The core script auto-installs the hook and connects WS. -->
    <script src="/core.js"></script>

    <script>
      // A tiny stand-in for Relay's RecordSource. The real thing has a
      // toJSON() that returns a flat id-keyed map — we do the same.
      function makeFakeEnvironment() {
        const records = {
          'client:root': {
            __id: 'client:root',
            __typename: '__Root',
            'user(id:"1")': { __ref: 'User:1' },
            inbox: { __ref: 'Inbox:default' },
          },
          'User:1': {
            __id: 'User:1',
            __typename: 'User',
            id: '1',
            name: 'Ada Lovelace',
            email: 'ada@example.com',
            posts: { __ref: 'PostConn:1' },
          },
          'PostConn:1': {
            __id: 'PostConn:1',
            __typename: 'PostConnection',
            edges: { __refs: ['PostEdge:1', 'PostEdge:2'] },
          },
          'PostEdge:1': {
            __id: 'PostEdge:1',
            __typename: 'PostEdge',
            node: { __ref: 'Post:1' },
          },
          'PostEdge:2': {
            __id: 'PostEdge:2',
            __typename: 'PostEdge',
            node: { __ref: 'Post:2' },
          },
          'Post:1': {
            __id: 'Post:1',
            __typename: 'Post',
            id: '1',
            title: 'First post',
            views: 42,
          },
          'Post:2': {
            __id: 'Post:2',
            __typename: 'Post',
            id: '2',
            title: 'Second post',
            views: 17,
          },
          'Inbox:default': {
            __id: 'Inbox:default',
            __typename: 'Inbox',
            unreadCount: 3,
          },
        };

        const source = {
          toJSON() {
            return records;
          },
          get(id) {
            return records[id];
          },
          set(id, rec) {
            records[id] = rec;
          },
          getRecordIDs() {
            return Object.keys(records);
          },
        };

        const env = {
          __log(_event) {
            /* will be wrapped by the inspector hook */
          },
          getStore() {
            return { getSource: () => source };
          },
          _records: records,
        };

        return env;
      }

      // Wait for the hook to be installed by core.js, then register.
      function whenHookReady(fn) {
        if (window.__RELAY_DEVTOOLS_HOOK__) return fn();
        setTimeout(() => whenHookReady(fn), 50);
      }

      whenHookReady(() => {
        const env = makeFakeEnvironment();
        window.__RELAY_DEVTOOLS_HOOK__.inject(env);
        window.__demoEnv = env;
        log(
          'environment registered; ' +
            Object.keys(env._records).length +
            ' records',
        );
      });

      function log(msg) {
        const el = document.getElementById('log');
        el.textContent = '> ' + msg + '\n' + el.textContent;
      }

      function publish(mutator) {
        const env = window.__demoEnv;
        if (!env) return log('demo env not ready');
        mutator(env._records);
        env.__log({ name: 'store.publish' });
      }

      document.getElementById('btn-add-post').onclick = () => {
        const n =
          Object.keys(window.__demoEnv._records).filter((k) =>
            k.startsWith('Post:'),
          ).length + 1;
        publish((records) => {
          const id = 'Post:' + n;
          records[id] = {
            __id: id,
            __typename: 'Post',
            id: String(n),
            title: 'Post #' + n,
            views: Math.floor(Math.random() * 100),
          };
        });
        log('added Post:' + n);
      };

      document.getElementById('btn-bump-views').onclick = () => {
        publish((records) => {
          records['Post:1'] = {
            ...records['Post:1'],
            views: (records['Post:1'].views ?? 0) + 1,
          };
        });
        log('bumped Post:1 views');
      };

      document.getElementById('btn-rename').onclick = () => {
        const names = [
          'Ada Lovelace',
          'Grace Hopper',
          'Alan Turing',
          'Karen Spärck Jones',
        ];
        const next = names[Math.floor(Math.random() * names.length)];
        publish((records) => {
          records['User:1'] = { ...records['User:1'], name: next };
        });
        log('renamed User:1 → ' + next);
      };
    </script>

    <div class="row">
      <button id="btn-add-post">Add a Post</button>
      <button id="btn-bump-views">Bump Post:1.views</button>
      <button id="btn-rename">Rename User:1</button>
    </div>

    <pre id="log" class="muted">(no events yet)</pre>
  </body>
</html>
